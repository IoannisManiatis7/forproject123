version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    container_name: tovima-wp
    restart: always
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: tovima-mysql
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: tovima_db
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:5.7
    container_name: tovima-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tovima_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
